<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>فني صيانة الهواتف</title>
<style>
  :root {
    --bg: #070b1a;
    --panel: rgba(20, 28, 56, 0.78);
    --line: rgba(120, 150, 255, 0.18);
    --text: #e8edff;
    --muted: #93a0c9;
    --cyan: #22d3ee;
    --violet: #8b5cf6;
    --pink: #f472b6;
    --amber: #fbbf24;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 18px; min-height: 100vh;
    font-family: Tahoma, 'Segoe UI', Arial, sans-serif;
    color: var(--text);
    background:
      radial-gradient(circle at 15% 10%, rgba(139,92,246,.28), transparent 45%),
      radial-gradient(circle at 85% 30%, rgba(34,211,238,.22), transparent 45%),
      radial-gradient(circle at 50% 100%, rgba(244,114,182,.18), transparent 50%),
      var(--bg);
    background-attachment: fixed;
    overflow-x: hidden;
  }
  .bg-art { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
  .bg-art svg { position: absolute; opacity: .13; }
  .a1 { top: 6%; right: 4%; width: 90px; transform: rotate(14deg); }
  .a2 { top: 40%; left: 3%; width: 70px; transform: rotate(-18deg); }
  .a3 { bottom: 8%; right: 10%; width: 110px; transform: rotate(8deg); }
  .a4 { top: 70%; left: 18%; width: 60px; transform: rotate(25deg); }
  .a5 { top: 18%; left: 28%; width: 50px; transform: rotate(-8deg); }
  .box {
    position: relative; z-index: 1;
    max-width: 780px; margin: 0 auto; padding: 22px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 22px;
    backdrop-filter: blur(14px);
    box-shadow: 0 20px 60px rgba(0,0,0,.45);
  }
  .head { text-align: center; margin-bottom: 18px; }
  .head h1 {
    margin: 0 0 6px; font-size: 30px;
    background: linear-gradient(90deg, var(--cyan), var(--violet), var(--pink));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .head p { margin: 0; color: var(--muted); font-size: 14px; }
  label { display: block; margin: 14px 0 6px; font-weight: bold; font-size: 14px; color: var(--muted); }
  select, input, textarea {
    width: 100%; padding: 13px 14px; font-size: 16px; font-family: inherit;
    color: var(--text); background: rgba(8, 12, 30, .75);
    border: 1px solid var(--line); border-radius: 12px; outline: none;
    transition: border-color .2s, box-shadow .2s;
  }
  select:focus, input:focus, textarea:focus {
    border-color: var(--cyan); box-shadow: 0 0 0 3px rgba(34,211,238,.18);
  }
  textarea { min-height: 110px; resize: vertical; line-height: 1.7; }
  button {
    width: 100%; padding: 14px; margin-top: 18px; border: none; cursor: pointer;
    font-size: 16px; font-weight: bold; font-family: inherit; color: #06101f;
    background: linear-gradient(90deg, var(--cyan), var(--violet));
    border-radius: 12px; transition: transform .15s, opacity .2s;
  }
  button:hover { transform: translateY(-1px); }
  button:disabled { opacity: .45; cursor: not-allowed; transform: none; }
  button:focus-visible { outline: 3px solid var(--amber); outline-offset: 2px; }

  #modelCard {
    display: flex; align-items: center; gap: 16px; margin-top: 16px; padding: 14px;
    background: rgba(8,12,30,.6); border: 1px solid var(--line); border-radius: 16px;
  }
  #modelCard .phones { display: flex; gap: 10px; flex-shrink: 0; }
  #modelCard .phones svg { height: 120px; width: auto; filter: drop-shadow(0 8px 14px rgba(0,0,0,.5)); }
  #modelCard .info b { display: block; font-size: 18px; margin-bottom: 4px; }
  #modelCard .info span { color: var(--muted); font-size: 13px; }

  #chat { display: none; }
  #log { height: 52vh; overflow-y: auto; padding: 8px 2px; scroll-behavior: smooth; }
  .msg { max-width: 86%; padding: 11px 15px; border-radius: 16px; margin: 9px 0; line-height: 1.9; white-space: pre-wrap; word-wrap: break-word; }
  .bot { background: rgba(8,12,30,.85); border: 1px solid var(--line); margin-left: auto; border-top-right-radius: 4px; }
  .me { background: linear-gradient(135deg, var(--cyan), var(--violet)); color: #06101f; margin-right: auto; border-top-left-radius: 4px; font-weight: 600; }
  .msg img { max-width: 100%; border-radius: 10px; display: block; margin-bottom: 6px; }

  .thinking { display: flex; align-items: center; gap: 12px; color: var(--muted); }
  .dots { display: flex; gap: 5px; }
  .dots i { width: 9px; height: 9px; border-radius: 50%; background: var(--cyan); animation: bounce 1.2s infinite ease-in-out; }
  .dots i:nth-child(2) { background: var(--violet); animation-delay: .18s; }
  .dots i:nth-child(3) { background: var(--pink); animation-delay: .36s; }
  @keyframes bounce { 0%, 80%, 100% { transform: scale(.5); opacity: .4; } 40% { transform: scale(1); opacity: 1; } }

  #counter { display: none; text-align: center; font-size: 13px; color: var(--amber); margin: 6px 0 2px; }

  #composer { margin-top: 10px; padding: 10px; background: rgba(8,12,30,.7); border: 1px solid var(--line); border-radius: 16px; }
  #composer textarea { min-height: 78px; max-height: 200px; border: none; background: transparent; padding: 6px 8px; box-shadow: none; resize: none; }
  #composer textarea:focus { box-shadow: none; }
  #tools { display: flex; gap: 10px; align-items: center; }
  #tools button { margin: 0; width: auto; padding: 11px 22px; }
  #camBtn { background: rgba(120,150,255,.16); color: var(--text); font-size: 20px; padding: 9px 16px !important; }
  #send { flex: 1; }
  #preview { display: none; align-items: center; gap: 10px; margin-bottom: 8px; }
  #preview img { height: 56px; border-radius: 8px; }
  #preview button { width: auto; margin: 0; padding: 6px 12px; background: #ef4444; color: #fff; }

  #ended { display: none; text-align: center; padding: 22px 12px; margin-top: 10px; border: 1px dashed var(--line); border-radius: 16px; }
  #ended h3 { margin: 0 0 6px; color: var(--amber); }
  #ended p { margin: 0 0 4px; color: var(--muted); }

  @media (max-width: 560px) {
    body { padding: 10px; } .box { padding: 16px; }
    #modelCard { flex-direction: column; text-align: center; }
    #modelCard .phones svg { height: 100px; }
  }
  @media (prefers-reduced-motion: reduce) { .dots i { animation: none; opacity: 1; } }
</style>
</head>
<body>

<div class="bg-art" aria-hidden="true">
  <svg class="a1" viewBox="0 0 64 110" fill="none" stroke="#22d3ee" stroke-width="3"><rect x="6" y="4" width="52" height="102" rx="10"/><rect x="26" y="9" width="12" height="4" rx="2"/></svg>
  <svg class="a2" viewBox="0 0 100 100" fill="none" stroke="#8b5cf6" stroke-width="6"><circle cx="50" cy="50" r="16"/><path d="M50 8v14M50 78v14M8 50h14M78 50h14M20 20l10 10M70 70l10 10M80 20L70 30M30 70L20 80"/></svg>
  <svg class="a3" viewBox="0 0 64 110" fill="none" stroke="#f472b6" stroke-width="3"><rect x="6" y="4" width="52" height="102" rx="10"/><circle cx="22" cy="20" r="6"/><circle cx="40" cy="20" r="6"/></svg>
  <svg class="a4" viewBox="0 0 100 100" fill="none" stroke="#fbbf24" stroke-width="7"><path d="M70 14a22 22 0 0 0-26 28L14 72l14 14 30-30a22 22 0 0 0 28-26l-14 14-12-4-4-12z"/></svg>
  <svg class="a5" viewBox="0 0 100 60" fill="none" stroke="#22d3ee" stroke-width="5"><rect x="4" y="10" width="82" height="40" rx="6"/><rect x="86" y="22" width="10" height="16" rx="3"/><path d="M18 22h30"/></svg>
</div>

<div class="box">
  <div class="head">
    <h1>🔧 فني صيانة الهواتف</h1>
    <p>اشرح مشكلة موبايلك واعرف السبب والحل في دقايق</p>
  </div>

  <div id="setup">
    <label for="brand">الماركة</label>
    <select id="brand"></select>
    <label for="model">الموديل</label>
    <select id="model"></select>

    <div id="modelCard">
      <div class="phones" id="phoneArt"></div>
      <div class="info"><b id="modelName"></b><span id="brandName"></span></div>
    </div>

    <label for="os">نظام التشغيل وإصداره (مثلًا أندرويد 15 أو iOS 18)</label>
    <input id="os" type="text" placeholder="اكتب إصدار النظام">
    <label for="fault">نوع العيب</label>
    <select id="fault"></select>
    <label for="desc">اشرح المشكلة بالتفصيل</label>
    <textarea id="desc" placeholder="مثال: الشاشة اتغيرت وحساس المكالمات مش شغال..."></textarea>
    <button id="start">ابدأ الكلام مع الفني</button>
  </div>

  <div id="chat">
    <div id="log"></div>
    <div id="counter"></div>
    <div id="composer">
      <div id="preview"><img id="previewImg" alt=""><button id="removeImg">إلغاء الصورة</button></div>
      <textarea id="text" placeholder="اكتب ردك هنا..."></textarea>
      <div id="tools">
        <button id="camBtn" title="ارفع صورة">📷</button>
        <button id="send">إرسال</button>
      </div>
    </div>
    <div id="ended">
      <h3>خلصت المحادثة</h3>
      <p>لو لسه محتاج مساعدة، ابدأ مشكلة جديدة أو زور الورشة.</p>
      <button id="restart">ابدأ من جديد</button>
    </div>
    <input id="file" type="file" accept="image/*" style="display:none">
  </div>
</div>
