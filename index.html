<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>فني صيانة الهواتف</title>
<style>
  body { font-family: Tahoma, Arial, sans-serif; background:#0f172a; color:#e2e8f0; margin:0; padding:16px; }
  .box { max-width:760px; margin:auto; background:#1e293b; padding:20px; border-radius:16px; }
  h1 { text-align:center; color:#38bdf8; margin-top:0; }
  label { display:block; margin:12px 0 6px; font-weight:bold; }
  select, input, textarea, button { width:100%; padding:12px; border-radius:10px; font-size:16px; box-sizing:border-box; border:1px solid #334155; background:#0f172a; color:#e2e8f0; }
  textarea { min-height:100px; }
  button { background:#38bdf8; color:#0f172a; font-weight:bold; margin-top:16px; cursor:pointer; border:none; }
  button:disabled { opacity:.5; }
  #chat { display:none; }
  #log { height:55vh; overflow-y:auto; padding:8px 0; }
  .msg { max-width:85%; padding:10px 14px; border-radius:14px; margin:8px 0; line-height:1.8; white-space:pre-wrap; }
  .bot { background:#0f172a; border:1px solid #334155; margin-left:auto; }
  .me { background:#38bdf8; color:#0f172a; margin-right:auto; }
  .msg img { max-width:100%; border-radius:10px; display:block; margin-bottom:6px; }
  #row { display:flex; gap:8px; margin-top:8px; }
  #row input { flex:1; }
  #row button { width:90px; margin-top:0; }
  #camBtn { width:52px; margin-top:0; background:#334155; color:#e2e8f0; font-size:22px; padding:8px; }
  #preview { display:none; align-items:center; gap:10px; margin-top:8px; }
  #preview img { height:56px; border-radius:8px; }
  #preview button { width:auto; margin-top:0; padding:6px 12px; background:#ef4444; color:#fff; }
</style>
</head>
<body>
<div class="box">
  <h1>🔧 فني صيانة الهواتف</h1>

  <div id="setup">
    <label>الماركة</label>
    <select id="brand"></select>
    <label>الموديل</label>
    <select id="model"></select>
    <label>نظام التشغيل وإصداره (مثلًا أندرويد 15 أو iOS 18)</label>
    <input id="os" type="text" placeholder="اكتب إصدار النظام">
    <label>نوع العيب</label>
    <select id="fault"></select>
    <label>اشرح المشكلة بالتفصيل</label>
    <textarea id="desc" placeholder="مثال: الشاشة اتغيرت وحساس المكالمات مش شغال..."></textarea>
    <button id="start">ابدأ الكلام مع الفني</button>
  </div>

  <div id="chat">
    <div id="log"></div>
    <div id="preview"><img id="previewImg" alt=""><button id="removeImg">إلغاء الصورة</button></div>
    <div id="row">
      <button id="camBtn" title="ارفع صورة">📷</button>
      <input id="text" type="text" placeholder="اكتب ردك هنا...">
      <button id="send">إرسال</button>
    </div>
    <input id="file" type="file" accept="image/*" style="display:none">
  </div>
</div>

<script src="phones.js"></script>
<script>
  const brandEl = document.getElementById('brand');
  const modelEl = document.getElementById('model');
  const faultEl = document.getElementById('fault');
  const logEl = document.getElementById('log');
  const textEl = document.getElementById('text');
  const sendBtn = document.getElementById('send');
  const startBtn = document.getElementById('start');
  const camBtn = document.getElementById('camBtn');
  const fileEl = document.getElementById('file');
  const previewBox = document.getElementById('preview');
  const previewImg = document.getElementById('previewImg');
  const removeImg = document.getElementById('removeImg');

  Object.keys(PHONES).forEach(b => brandEl.add(new Option(b, b)));
  FAULTS.forEach(f => faultEl.add(new Option(f, f)));

  function loadModels() {
    modelEl.innerHTML = '';
    PHONES[brandEl.value].forEach(m => modelEl.add(new Option(m, m)));
  }
  brandEl.addEventListener('change', loadModels);
  loadModels();

  let info = {};
  let messages = [];
  let pendingImage = null;

  function addMsg(text, who, imgSrc) {
    const d = document.createElement('div');
    d.className = 'msg ' + who;
    if (imgSrc) {
      const im = document.createElement('img');
      im.src = imgSrc;
      d.appendChild(im);
    }
    if (text) d.appendChild(document.createTextNode(text));
    logEl.appendChild(d);
    logEl.scrollTop = logEl.scrollHeight;
  }

  function shrinkImage(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onerror = reject;
      reader.onload = () => {
        const img = new Image();
        img.onerror = reject;
        img.onload = () => {
          const max = 1024;
          let w = img.width, h = img.height;
          if (w > max || h > max) {
            const r = Math.min(max / w, max / h);
            w = Math.round(w * r);
            h = Math.round(h * r);
          }
          const c = document.createElement('canvas');
          c.width = w; c.height = h;
          c.getContext('2d').drawImage(img, 0, 0, w, h);
          const url = c.toDataURL('image/jpeg', 0.8);
          resolve({ url, data: url.split(',')[1], mimeType: 'image/jpeg' });
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
  }

  camBtn.addEventListener('click', () => fileEl.click());
  fileEl.addEventListener('change', async () => {
    const f = fileEl.files[0];
    if (!f) return;
    try {
      pendingImage = await shrinkImage(f);
      previewImg.src = pendingImage.url;
      previewBox.style.display = 'flex';
    } catch (e) {
      addMsg('معرفتش أقرأ الصورة، جرب صورة تانية.', 'bot');
    }
    fileEl.value = '';
  });
  removeImg.addEventListener('click', () => {
    pendingImage = null;
    previewBox.style.display = 'none';
  });

  async function ask() {
    sendBtn.disabled = true;
    try {
      const res = await fetch('/.netlify/functions/diagnose', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ ...info, messages })
      });
      const data = await res.json();
      const answer = data.answer || data.error || 'حصل خطأ';
      messages.push({ role: 'model', text: answer });
      addMsg(answer, 'bot');
    } catch (e) {
      addMsg('حصل خطأ في الاتصال، حاول تاني.', 'bot');
    }
    sendBtn.disabled = false;
  }

  startBtn.addEventListener('click', () => {
    info = {
      brand: brandEl.value,
      model: modelEl.value,
      os: document.getElementById('os').value,
      fault: faultEl.value,
      desc: document.getElementById('desc').value
    };
    document.getElementById('setup').style.display = 'none';
    document.getElementById('chat').style.display = 'block';
    const first = 'السلام عليكم، معايا ' + info.brand + ' ' + info.model + ' و' + info.fault + '. ' + info.desc;
    messages.push({ role: 'user', text: first });
    addMsg(first, 'me');
    ask();
  });

  function send() {
    const t = textEl.value.trim();
    if ((!t && !pendingImage) || sendBtn.disabled) return;
    textEl.value = '';
    const msg = { role: 'user', text: t || 'دي صورة المشكلة، حلللي إيه العطل والحل.' };
    if (pendingImage) {
      msg.image = { data: pendingImage.data, mimeType: pendingImage.mimeType };
      addMsg(t, 'me', pendingImage.url);
    } else {
      addMsg(t, 'me');
    }
    messages.push(msg);
    pendingImage = null;
    previewBox.style.display = 'none';
    ask();
  }
  sendBtn.addEventListener('click', send);
  textEl.addEventListener('keydown', e => { if (e.key === 'Enter') send(); });
</script>
</body>
</html>
