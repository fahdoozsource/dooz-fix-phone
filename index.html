<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>فني صيانة الهواتف</title>
<style>
  :root {
    --bg: #070b1a;
    --panel: rgba(20, 28, 56, 0.78);
    --line: rgba(120, 150, 255, 0.18);
    --text: #e8edff;
    --muted: #93a0c9;
    --cyan: #22d3ee;
    --violet: #8b5cf6;
    --pink: #f472b6;
    --amber: #fbbf24;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 18px; min-height: 100vh;
    font-family: Tahoma, 'Segoe UI', Arial, sans-serif;
    color: var(--text);
    background:
      radial-gradient(circle at 15% 10%, rgba(139,92,246,.28), transparent 45%),
      radial-gradient(circle at 85% 30%, rgba(34,211,238,.22), transparent 45%),
      radial-gradient(circle at 50% 100%, rgba(244,114,182,.18), transparent 50%),
      var(--bg);
    background-attachment: fixed;
    overflow-x: hidden;
  }
  .bg-art { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
  .bg-art svg { position: absolute; opacity: .13; }
  .a1 { top: 6%; right: 4%; width: 90px; transform: rotate(14deg); }
  .a2 { top: 40%; left: 3%; width: 70px; transform: rotate(-18deg); }
  .a3 { bottom: 8%; right: 10%; width: 110px; transform: rotate(8deg); }
  .a4 { top: 70%; left: 18%; width: 60px; transform: rotate(25deg); }
  .a5 { top: 18%; left: 28%; width: 50px; transform: rotate(-8deg); }
  .box {
    position: relative; z-index: 1;
    max-width: 780px; margin: 0 auto; padding: 22px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 22px;
    backdrop-filter: blur(14px);
    box-shadow: 0 20px 60px rgba(0,0,0,.45);
  }
  .head { text-align: center; margin-bottom: 18px; }
  .head h1 {
    margin: 0 0 6px; font-size: 30px;
    background: linear-gradient(90deg, var(--cyan), var(--violet), var(--pink));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .head p { margin: 0; color: var(--muted); font-size: 14px; }
  label { display: block; margin: 14px 0 6px; font-weight: bold; font-size: 14px; color: var(--muted); }
  select, input, textarea {
    width: 100%; padding: 13px 14px; font-size: 16px; font-family: inherit;
    color: var(--text); background: rgba(8, 12, 30, .75);
    border: 1px solid var(--line); border-radius: 12px; outline: none;
    transition: border-color .2s, box-shadow .2s;
  }
  select:focus, input:focus, textarea:focus {
    border-color: var(--cyan); box-shadow: 0 0 0 3px rgba(34,211,238,.18);
  }
  textarea { min-height: 110px; resize: vertical; line-height: 1.7; }
  button {
    width: 100%; padding: 14px; margin-top: 18px; border: none; cursor: pointer;
    font-size: 16px; font-weight: bold; font-family: inherit; color: #06101f;
    background: linear-gradient(90deg, var(--cyan), var(--violet));
    border-radius: 12px; transition: transform .15s, opacity .2s;
  }
  button:hover { transform: translateY(-1px); }
  button:disabled { opacity: .45; cursor: not-allowed; transform: none; }
  button:focus-visible { outline: 3px solid var(--amber); outline-offset: 2px; }

  #modelCard {
    display: flex; align-items: center; gap: 16px; margin-top: 16px; padding: 14px;
    background: rgba(8,12,30,.6); border: 1px solid var(--line); border-radius: 16px;
  }
  #modelCard .phones { display: flex; gap: 10px; flex-shrink: 0; }
  #modelCard .phones svg { height: 120px; width: auto; filter: drop-shadow(0 8px 14px rgba(0,0,0,.5)); }
  #modelCard .info b { display: block; font-size: 18px; margin-bottom: 4px; }
  #modelCard .info span { color: var(--muted); font-size: 13px; }

  #chat { display: none; }
  .chat-top { display: flex; justify-content: flex-end; margin-bottom: 6px; }
  .copy-btn {
    width: auto; margin: 0; padding: 7px 14px; font-size: 13px;
    background: rgba(120,150,255,.16); color: var(--text); border-radius: 10px;
  }
  #log { height: 52vh; overflow-y: auto; padding: 8px 2px; scroll-behavior: smooth; }
  .msg { max-width: 86%; padding: 11px 15px; border-radius: 16px; margin: 9px 0; line-height: 1.9; white-space: pre-wrap; word-wrap: break-word; }
  .bot { background: rgba(8,12,30,.85); border: 1px solid var(--line); margin-left: auto; border-top-right-radius: 4px; }
  .me { background: linear-gradient(135deg, var(--cyan), var(--violet)); color: #06101f; margin-right: auto; border-top-left-radius: 4px; font-weight: 600; }
  .err-msg { border-color: rgba(239,68,68,.55); color: #fca5a5; }
  .msg img { max-width: 100%; border-radius: 10px; display: block; margin-bottom: 6px; }

  .thinking { display: flex; align-items: center; gap: 12px; color: var(--muted); }
  .dots { display: flex; gap: 5px; }
  .dots i { width: 9px; height: 9px; border-radius: 50%; background: var(--cyan); animation: bounce 1.2s infinite ease-in-out; }
  .dots i:nth-child(2) { background: var(--violet); animation-delay: .18s; }
  .dots i:nth-child(3) { background: var(--pink); animation-delay: .36s; }
  @keyframes bounce { 0%, 80%, 100% { transform: scale(.5); opacity: .4; } 40% { transform: scale(1); opacity: 1; } }

  #counter { display: none; text-align: center; font-size: 13px; color: var(--amber); margin: 6px 0 2px; }

  #composer { margin-top: 10px; padding: 10px; background: rgba(8,12,30,.7); border: 1px solid var(--line); border-radius: 16px; }
  #composer textarea { min-height: 78px; max-height: 200px; border: none; background: transparent; padding: 6px 8px; box-shadow: none; resize: none; }
  #composer textarea:focus { box-shadow: none; }
  #tools { display: flex; gap: 10px; align-items: center; }
  #tools button { margin: 0; width: auto; padding: 11px 22px; }
  #camBtn { background: rgba(120,150,255,.16); color: var(--text); font-size: 20px; padding: 9px 16px !important; }
  #send { flex: 1; }
  #preview { display: none; align-items: center; gap: 10px; margin-bottom: 8px; }
  #preview img { height: 56px; border-radius: 8px; }
  #preview button { width: auto; margin: 0; padding: 6px 12px; background: #ef4444; color: #fff; }

  #ended { display: none; text-align: center; padding: 22px 12px; margin-top: 10px; border: 1px dashed var(--line); border-radius: 16px; }
  #ended h3 { margin: 0 0 6px; color: var(--amber); }
  #ended p { margin: 0 0 4px; color: var(--muted); }

  /* الزرارات الجديدة */
  .link-btn {
    width: 100%; margin-top: 10px; padding: 11px; font-size: 14px;
    background: rgba(120,150,255,.12); color: var(--text);
    border: 1px dashed var(--line); border-radius: 12px;
  }
  .link-btn:hover { background: rgba(120,150,255,.22); }
  #unsolvedBtn { display: none; margin-top: 8px; }
  .bottom-links { display: flex; flex-direction: column; gap: 0; margin-top: 6px; }

  /* النافذة */
  #modal {
    display: none; position: fixed; inset: 0; z-index: 50;
    background: rgba(3,6,18,.78); backdrop-filter: blur(6px);
    align-items: center; justify-content: center; padding: 16px;
  }
  #modal.open { display: flex; }
  .modal-card {
    width: 100%; max-width: 460px; max-height: 92vh; overflow-y: auto;
    padding: 20px; background: #0d1430;
    border: 1px solid var(--line); border-radius: 20px;
    box-shadow: 0 20px 60px rgba(0,0,0,.6);
  }
  .modal-card h3 { margin: 0 0 4px; font-size: 20px; color: var(--cyan); }
  .modal-card .sub { margin: 0 0 8px; color: var(--muted); font-size: 13px; line-height: 1.7; }
  .modal-card textarea { min-height: 90px; }
  .modal-actions { display: flex; gap: 10px; margin-top: 16px; }
  .modal-actions button { margin: 0; }
  #modalCancel { background: rgba(120,150,255,.16); color: var(--text); }
  #modalStatus { margin-top: 12px; text-align: center; font-size: 14px; min-height: 20px; }
  #modalStatus.ok { color: #6ee7b7; }
  #modalStatus.bad { color: #fca5a5; }

  @media (max-width: 560px) {
    body { padding: 10px; } .box { padding: 16px; }
    #modelCard { flex-direction: column; text-align: center; }
    #modelCard .phones svg { height: 100px; }
  }
  @media (prefers-reduced-motion: reduce) { .dots i { animation: none; opacity: 1; } }
</style>
</head>
<body>

<div class="bg-art" aria-hidden="true">
  <svg class="a1" viewBox="0 0 64 110" fill="none" stroke="#22d3ee" stroke-width="3"><rect x="6" y="4" width="52" height="102" rx="10"/><rect x="26" y="9" width="12" height="4" rx="2"/></svg>
  <svg class="a2" viewBox="0 0 100 100" fill="none" stroke="#8b5cf6" stroke-width="6"><circle cx="50" cy="50" r="16"/><path d="M50 8v14M50 78v14M8 50h14M78 50h14M20 20l10 10M70 70l10 10M80 20L70 30M30 70L20 80"/></svg>
  <svg class="a3" viewBox="0 0 64 110" fill="none" stroke="#f472b6" stroke-width="3"><rect x="6" y="4" width="52" height="102" rx="10"/><circle cx="22" cy="20" r="6"/><circle cx="40" cy="20" r="6"/></svg>
  <svg class="a4" viewBox="0 0 100 100" fill="none" stroke="#fbbf24" stroke-width="7"><path d="M70 14a22 22 0 0 0-26 28L14 72l14 14 30-30a22 22 0 0 0 28-26l-14 14-12-4-4-12z"/></svg>
  <svg class="a5" viewBox="0 0 100 60" fill="none" stroke="#22d3ee" stroke-width="5"><rect x="4" y="10" width="82" height="40" rx="6"/><rect x="86" y="22" width="10" height="16" rx="3"/><path d="M18 22h30"/></svg>
</div>

<!-- نماذج مخفية: نيتلفاي بيقراها وقت النشر عشان يستقبل الرسايل. متمسحهاش -->
<form name="feedback" data-netlify="true" hidden>
  <input name="type">
  <input name="brand">
  <input name="model">
  <input name="contact">
  <textarea name="message"></textarea>
  <textarea name="conversation"></textarea>
</form>

<div class="box">
  <div class="head">
    <h1>🔧 فني صيانة الهواتف</h1>
    <p>اشرح مشكلة موبايلك واعرف السبب والحل في دقايق</p>
  </div>

  <div id="setup">
    <label for="brand">الماركة</label>
    <select id="brand"></select>
    <label for="model">الموديل</label>
    <select id="model"></select>

    <div id="modelCard">
      <div class="phones" id="phoneArt"></div>
      <div class="info"><b id="modelName"></b><span id="brandName"></span></div>
    </div>

    <button id="missingModelBtn" class="link-btn" type="button">مش لاقي موديل موبايلي في القايمة</button>

    <label for="os">نظام التشغيل وإصداره (مثلًا أندرويد 15 أو iOS 18)</label>
    <input id="os" type="text" placeholder="اكتب إصدار النظام">
    <label for="fault">نوع العيب</label>
    <select id="fault"></select>
    <label for="desc">اشرح المشكلة بالتفصيل</label>
    <textarea id="desc" placeholder="مثال: الشاشة اتغيرت وحساس المكالمات مش شغال..."></textarea>
    <button id="start">ابدأ الكلام مع الفني</button>

    <div class="bottom-links">
      <button id="suggestBtn" class="link-btn" type="button">عندك اقتراح لتطوير الموقع؟</button>
    </div>
  </div>

  <div id="chat">
    <div class="chat-top">
      <button id="copyLast" class="copy-btn" type="button">نسخ آخر رد</button>
    </div>
    <div id="log"></div>
    <div id="counter"></div>
    <button id="unsolvedBtn" class="link-btn" type="button">المشكلة ماتحلتش معايا</button>
    <div id="composer">
      <div id="preview"><img id="previewImg" alt=""><button id="removeImg" type="button">إلغاء الصورة</button></div>
      <textarea id="text" placeholder="اكتب ردك هنا..."></textarea>
      <div id="tools">
        <button id="camBtn" type="button" title="ارفع صورة">📷</button>
        <button id="send" type="button">إرسال</button>
      </div>
    </div>
    <div id="ended">
      <h3>خلصت المحادثة</h3>
      <p>لو لسه محتاج مساعدة، ابدأ مشكلة جديدة أو زور الورشة.</p>
      <button id="restart" type="button">ابدأ من جديد</button>
    </div>
    <input id="file" type="file" accept="image/*" style="display:none">
  </div>
</div>

<!-- النافذة المشتركة للشكاوي والاقتراحات -->
<div id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div class="modal-card">
    <h3 id="modalTitle"></h3>
    <p class="sub" id="modalSub"></p>

    <div id="modalModelFields">
      <label for="fbBrand">الماركة</label>
      <input id="fbBrand" type="text" placeholder="مثال: Samsung">
      <label for="fbModel">اسم الموديل</label>
      <input id="fbModel" type="text" placeholder="مثال: Galaxy A07">
    </div>

    <label for="fbMessage" id="fbMessageLabel">الرسالة</label>
    <textarea id="fbMessage" placeholder="اكتب هنا..."></textarea>

    <label for="fbContact">وسيلة تواصل (اختياري: رقم أو إيميل أو أي حاجة)</label>
    <input id="fbContact" type="text" placeholder="سيبها فاضية لو مش عاوز">

    <div id="modalStatus"></div>
    <div class="modal-actions">
      <button id="modalSend" type="button">إرسال</button>
      <button id="modalCancel" type="button">إلغاء</button>
    </div>
  </div>
</div>

<script src="phones.js"></script>
<script>
  const MAX_FOLLOWUPS = 10;

  const brandEl = document.getElementById('brand');
  const modelEl = document.getElementById('model');
  const faultEl = document.getElementById('fault');
  const logEl = document.getElementById('log');
  const textEl = document.getElementById('text');
  const sendBtn = document.getElementById('send');
  const startBtn = document.getElementById('start');
  const camBtn = document.getElementById('camBtn');
  const fileEl = document.getElementById('file');
  const previewBox = document.getElementById('preview');
  const previewImg = document.getElementById('previewImg');
  const removeImg = document.getElementById('removeImg');
  const counterEl = document.getElementById('counter');
  const composerEl = document.getElementById('composer');
  const endedEl = document.getElementById('ended');
  const restartBtn = document.getElementById('restart');
  const copyLastBtn = document.getElementById('copyLast');
  const phoneArt = document.getElementById('phoneArt');
  const modelName = document.getElementById('modelName');
  const brandName = document.getElementById('brandName');
  const unsolvedBtn = document.getElementById('unsolvedBtn');

  const BRAND_COLORS = {
    'Samsung': ['#1428a0', '#4f7cff'],
    'Apple iPhone': ['#6b7280', '#e5e7eb'],
    'Xiaomi': ['#ff6900', '#ffb27a'],
    'Oppo': ['#0a8f4f', '#5eead4'],
    'Realme': ['#f5c518', '#fde68a'],
    'Huawei': ['#c8102e', '#fb7185'],
    'Honor': ['#0ea5e9', '#7dd3fc'],
    'Vivo': ['#415fff', '#a5b4fc'],
    'Infinix': ['#10b981', '#6ee7b7'],
    'Tecno': ['#2563eb', '#93c5fd'],
    'Google Pixel': ['#ea4335', '#fbbc04'],
    'OnePlus': ['#eb0028', '#fca5a5'],
    'Motorola': ['#5b21b6', '#c4b5fd'],
    'Nokia': ['#124191', '#7aa2f7'],
    'Sony': ['#111827', '#6b7280'],
    'ZTE / Nubia': ['#0891b2', '#67e8f9'],
    'Lenovo': ['#e2231a', '#fca5a5'],
    'Itel': ['#f97316', '#fdba74'],
    'Other': ['#475569', '#94a3b8']
  };

  Object.keys(PHONES).forEach(b => brandEl.add(new Option(b, b)));
  FAULTS.forEach(f => faultEl.add(new Option(f, f)));

  function isSafeHex(v) {
    return typeof v === 'string' && /^#[0-9a-fA-F]{3,8}$/.test(v);
  }

  function phoneSVG(c1, c2, side) {
    const safe1 = isSafeHex(c1) ? c1 : '#475569';
    const safe2 = isSafeHex(c2) ? c2 : '#94a3b8';
    const id = side + Math.random().toString(36).slice(2, 7);
    if (side === 'front') {
      return '<svg viewBox="0 0 70 130" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="' + id + '" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="' + safe1 + '"/><stop offset="1" stop-color="' + safe2 + '"/></linearGradient></defs><rect x="3" y="3" width="64" height="124" rx="12" fill="#0b1020" stroke="#aab4d6" stroke-width="2"/><rect x="8" y="10" width="54" height="110" rx="7" fill="url(#' + id + ')"/><circle cx="35" cy="16" r="2.5" fill="#0b1020"/></svg>';
    }
    return '<svg viewBox="0 0 70 130" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="' + id + '" x1="1" y1="0" x2="0" y2="1"><stop offset="0" stop-color="' + safe1 + '"/><stop offset="1" stop-color="' + safe2 + '"/></linearGradient></defs><rect x="3" y="3" width="64" height="124" rx="12" fill="url(#' + id + ')" stroke="#aab4d6" stroke-width="2"/><rect x="10" y="10" width="28" height="34" rx="9" fill="#0b1020" opacity=".85"/><circle cx="20" cy="20" r="5" fill="#334155" stroke="#cbd5e1"/><circle cx="20" cy="34" r="5" fill="#334155" stroke="#cbd5e1"/><circle cx="31" cy="27" r="3" fill="#fde68a"/></svg>';
  }

  function updateCard() {
    const cols = BRAND_COLORS[brandEl.value] || BRAND_COLORS['Other'];
    phoneArt.innerHTML = phoneSVG(cols[0], cols[1], 'front') + phoneSVG(cols[0], cols[1], 'back');
    modelName.textContent = modelEl.value;
    brandName.textContent = brandEl.value;
  }

  function loadModels() {
    modelEl.innerHTML = '';
    (PHONES[brandEl.value] || []).forEach(m => modelEl.add(new Option(m, m)));
    updateCard();
  }
  brandEl.addEventListener('change', loadModels);
  modelEl.addEventListener('change', updateCard);
  loadModels();

  let info = {};
  let messages = [];
  let pendingImage = null;
  let followups = 0;
  let thinkingEl = null;
  let thinkingTimers = [];
  let lastBotReply = '';

  function setBusy(busy) {
    sendBtn.disabled = busy;
    textEl.disabled = busy;
    camBtn.disabled = busy;
    removeImg.disabled = busy;
    unsolvedBtn.disabled = busy;
  }

  function addMsg(text, who, imgSrc, isError) {
    const d = document.createElement('div');
    d.className = 'msg ' + who + (isError ? ' err-msg' : '');
    if (imgSrc) {
      const im = document.createElement('img');
      im.src = imgSrc;
      d.appendChild(im);
    }
    if (text) d.appendChild(document.createTextNode(text));
    logEl.appendChild(d);
    logEl.scrollTop = logEl.scrollHeight;
    return d;
  }

  const THINKING_STEPS = [
    { at: 0,     text: 'تم إرسال مشكلتك للفني' },
    { at: 2500,  text: 'الفني استلم رسالتك وبيقراها' },
    { at: 5500,  text: 'الفني بيشوف العطل بتاعك' },
    { at: 9000,  text: 'الفني بيحدد مكان العطل وسببه' },
    { at: 13000, text: 'الفني بيجهز لك الحل بالتفصيل' },
    { at: 18000, text: 'الفني بيكتب لك الرد، ثواني وهيوصل' }
  ];

  function showThinking() {
    thinkingEl = document.createElement('div');
    thinkingEl.className = 'msg bot thinking';
    const dots = document.createElement('div');
    dots.className = 'dots';
    dots.innerHTML = '<i></i><i></i><i></i>';
    const label = document.createElement('span');
    thinkingEl.appendChild(dots);
    thinkingEl.appendChild(label);
    logEl.appendChild(thinkingEl);
    logEl.scrollTop = logEl.scrollHeight;

    THINKING_STEPS.forEach(step => {
      const t = setTimeout(() => {
        label.textContent = step.text;
        logEl.scrollTop = logEl.scrollHeight;
      }, step.at);
      thinkingTimers.push(t);
    });
  }
  function hideThinking() {
    thinkingTimers.forEach(clearTimeout);
    thinkingTimers = [];
    if (thinkingEl) { thinkingEl.remove(); thinkingEl = null; }
  }

  function updateCounter() {
    if (followups === 0) { counterEl.style.display = 'none'; return; }
    counterEl.style.display = 'block';
    counterEl.textContent = 'باقي لك ' + Math.max(0, MAX_FOLLOWUPS - followups) + ' رسائل';
  }

  function endChat() {
    composerEl.style.display = 'none';
    counterEl.style.display = 'none';
    endedEl.style.display = 'block';
  }

  function shrinkImage(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onerror = reject;
      reader.onload = () => {
        const img = new Image();
        img.onerror = reject;
        img.onload = () => {
          const max = 1024;
          let w = img.width, h = img.height;
          if (w > max || h > max) {
            const r = Math.min(max / w, max / h);
            w = Math.round(w * r);
            h = Math.round(h * r);
          }
          const c = document.createElement('canvas');
          c.width = w; c.height = h;
          c.getContext('2d').drawImage(img, 0, 0, w, h);
          const url = c.toDataURL('image/jpeg', 0.8);
          resolve({ url, data: url.split(',')[1], mimeType: 'image/jpeg' });
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
  }

  camBtn.addEventListener('click', () => fileEl.click());
  fileEl.addEventListener('change', async () => {
    const f = fileEl.files[0];
    if (!f) return;
    try {
      pendingImage = await shrinkImage(f);
      previewImg.src = pendingImage.url;
      previewBox.style.display = 'flex';
    } catch (e) {
      addMsg('معرفتش أقرأ الصورة، جرب صورة تانية.', 'bot', null, true);
    }
    fileEl.value = '';
  });
  removeImg.addEventListener('click', () => {
    pendingImage = null;
    previewBox.style.display = 'none';
  });

  async function ask() {
    setBusy(true);
    showThinking();
    try {
      const res = await fetch('/.netlify/functions/diagnose', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ ...info, messages })
      });
      const data = await res.json();
      hideThinking();

      if (!res.ok || data.error) {
        addMsg(data.error || 'حصل خطأ في السيرفر، جرب تاني.', 'bot', null, true);
        setBusy(false);
        return;
      }

      if (data.ended) {
        if (data.answer) {
          lastBotReply = data.answer;
          addMsg(data.answer, 'bot');
        }
        endChat();
        setBusy(false);
        return;
      }

      const answer = data.answer || 'معنديش إجابة دلوقتي، جرب تاني.';
      lastBotReply = answer;
      messages.push({ role: 'model', text: answer });
      addMsg(answer, 'bot');
      if (followups >= MAX_FOLLOWUPS) {
        endChat();
      }
    } catch (e) {
      hideThinking();
      addMsg('حصل خطأ في الاتصال. تأكد من النت وحاول تاني.', 'bot', null, true);
    }
    setBusy(false);
  }

  startBtn.addEventListener('click', () => {
    info = {
      brand: brandEl.value,
      model: modelEl.value,
      os: document.getElementById('os').value.trim(),
      fault: faultEl.value,
      desc: document.getElementById('desc').value.trim()
    };
    document.getElementById('setup').style.display = 'none';
    document.getElementById('chat').style.display = 'block';
    unsolvedBtn.style.display = 'block';
    const first = 'السلام عليكم، معايا ' + info.brand + ' ' + info.model + ' و' + info.fault + (info.desc ? '. ' + info.desc : '');
    messages.push({ role: 'user', text: first });
    addMsg(first, 'me');
    ask();
  });

  function send() {
    const t = textEl.value.trim();
    if ((!t && !pendingImage) || sendBtn.disabled || followups >= MAX_FOLLOWUPS) return;
    textEl.value = '';
    const msg = { role: 'user', text: t || 'دي صورة المشكلة، حللي إيه العطل والحل.' };
    if (pendingImage) {
      msg.media = { data: pendingImage.data, mimeType: pendingImage.mimeType };
      addMsg(t, 'me', pendingImage.url);
    } else {
      addMsg(t, 'me');
    }
    messages.push(msg);
    pendingImage = null;
    previewBox.style.display = 'none';
    followups++;
    updateCounter();
    ask();
  }

  sendBtn.addEventListener('click', send);
  textEl.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey && window.innerWidth > 700) { e.preventDefault(); send(); }
  });

  copyLastBtn.addEventListener('click', async () => {
    if (!lastBotReply) return;
    try {
      await navigator.clipboard.writeText(lastBotReply);
      const old = copyLastBtn.textContent;
      copyLastBtn.textContent = 'تم النسخ ✓';
      setTimeout(() => { copyLastBtn.textContent = old; }, 1500);
    } catch (_) {}
  });

  restartBtn.addEventListener('click', () => location.reload());
  
  // ===== الشكاوي والاقتراحات =====
  const modalEl = document.getElementById('modal');
  const modalTitle = document.getElementById('modalTitle');
  const modalSub = document.getElementById('modalSub');
  const modalModelFields = document.getElementById('modalModelFields');
  const fbBrand = document.getElementById('fbBrand');
  const fbModel = document.getElementById('fbModel');
  const fbMessage = document.getElementById('fbMessage');
  const fbMessageLabel = document.getElementById('fbMessageLabel');
  const fbContact = document.getElementById('fbContact');
  const modalStatus = document.getElementById('modalStatus');
  const modalSend = document.getElementById('modalSend');
  const modalCancel = document.getElementById('modalCancel');

  let modalType = '';

  const MODAL_CONFIG = {
    'unsolved': {
      title: 'المشكلة ماتحلتش معاك',
      sub: 'ابعت لنا المشكلة ونراجعها ونرد عليك بحل تاني. سيب وسيلة تواصل لو عاوزنا نرجع لك.',
      label: 'إيه اللي جربته وماتحلش؟ (اختياري)',
      showModel: false
    },
    'missing-model': {
      title: 'مش لاقي موديلك؟',
      sub: 'اكتب اسم موبايلك وهنضيفه في الموقع قريب.',
      label: 'أي تفاصيل تانية (اختياري)',
      showModel: true
    },
    'suggestion': {
      title: 'اقتراح لتطوير الموقع',
      sub: 'قول لنا إيه اللي نضيفه أو نحسنه.',
      label: 'اقتراحك',
      showModel: false
    }
  };

  function openModal(type) {
    modalType = type;
    const cfg = MODAL_CONFIG[type];
    modalTitle.textContent = cfg.title;
    modalSub.textContent = cfg.sub;
    fbMessageLabel.textContent = cfg.label;
    modalModelFields.style.display = cfg.showModel ? 'block' : 'none';
    fbBrand.value = type === 'missing-model' ? brandEl.value : '';
    fbModel.value = '';
    fbMessage.value = '';
    fbContact.value = '';
    modalStatus.textContent = '';
    modalStatus.className = '';
    modalSend.disabled = false;
    modalEl.classList.add('open');
  }

  function closeModal() {
    modalEl.classList.remove('open');
  }

  function conversationText() {
    return messages.map(m => (m.role === 'user' ? 'العميل: ' : 'الفني: ') + (m.text || '')).join('\n\n');
  }

  function encodeForm(obj) {
    return Object.keys(obj).map(k => encodeURIComponent(k) + '=' + encodeURIComponent(obj[k])).join('&');
  }

  async function submitFeedback() {
    const message = fbMessage.value.trim();
    const brand = modalType === 'missing-model' ? fbBrand.value.trim() : (info.brand || '');
    const model = modalType === 'missing-model' ? fbModel.value.trim() : (info.model || '');

    if (modalType === 'suggestion' && !message) {
      modalStatus.textContent = 'اكتب اقتراحك الأول.';
      modalStatus.className = 'bad';
      return;
    }
    if (modalType === 'missing-model' && !model) {
      modalStatus.textContent = 'اكتب اسم الموديل الأول.';
      modalStatus.className = 'bad';
      return;
    }

    modalSend.disabled = true;
    modalStatus.textContent = 'جاري الإرسال...';
    modalStatus.className = '';

    const payload = {
      'form-name': 'feedback',
      type: modalType,
      brand: brand,
      model: model,
      contact: fbContact.value.trim(),
      message: message,
      conversation: modalType === 'unsolved' ? conversationText().slice(0, 6000) : ''
    };

    try {
      const res = await fetch('/', {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: encodeForm(payload)
      });
      if (!res.ok) throw new Error('bad status');
      modalStatus.textContent = 'وصلتنا رسالتك، شكرًا ليك 🙏';
      modalStatus.className = 'ok';
      setTimeout(closeModal, 1800);
    } catch (e) {
      modalStatus.textContent = 'حصلت مشكلة في الإرسال، جرب تاني.';
      modalStatus.className = 'bad';
      modalSend.disabled = false;
    }
  }

  document.getElementById('missingModelBtn').addEventListener('click', () => openModal('missing-model'));
  document.getElementById('suggestBtn').addEventListener('click', () => openModal('suggestion'));
  unsolvedBtn.addEventListener('click', () => openModal('unsolved'));
  modalSend.addEventListener('click', submitFeedback);
  modalCancel.addEventListener('click', closeModal);
  modalEl.addEventListener('click', e => { if (e.target === modalEl) closeModal(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
</script>
</body>
</html>
