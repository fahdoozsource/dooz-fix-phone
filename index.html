<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تشخيص أعطال الهواتف</title>
<style>
  body { font-family: Tahoma, Arial, sans-serif; background:#0f172a; color:#e2e8f0; margin:0; padding:20px; }
  .box { max-width:760px; margin:auto; background:#1e293b; padding:24px; border-radius:16px; }
  h1 { text-align:center; color:#38bdf8; }
  label { display:block; margin:14px 0 6px; font-weight:bold; }
  select, textarea, button { width:100%; padding:12px; border-radius:10px; border:none; font-size:16px; box-sizing:border-box; }
  select, textarea { background:#0f172a; color:#e2e8f0; border:1px solid #334155; }
  textarea { min-height:110px; }
  button { background:#38bdf8; color:#0f172a; font-weight:bold; margin-top:18px; cursor:pointer; }
  button:disabled { opacity:.5; }
  #result { margin-top:22px; background:#0f172a; padding:16px; border-radius:12px; line-height:1.9; white-space:pre-wrap; display:none; }
  #sources a { color:#38bdf8; display:block; margin:4px 0; }
</style>
</head>
<body>
<div class="box">
  <h1>🔧 تشخيص أعطال الهواتف</h1>

  <label>الماركة</label>
  <select id="brand"></select>

  <label>الموديل</label>
  <select id="model"></select>

  <label>نظام التشغيل وإصداره (مثلاً أندرويد 15 أو iOS 18)</label>
  <input id="os" type="text" placeholder="اكتب إصدار النظام" style="width:100%;padding:12px;border-radius:10px;border:1px solid #334155;background:#0f172a;color:#e2e8f0;font-size:16px;box-sizing:border-box;">

  <label>نوع العيب</label>
  <select id="fault"></select>

  <label>اشرح المشكلة بالتفصيل</label>
  <textarea id="desc" placeholder="مثال: التاتش بيتحرك لوحده بعد ما التليفون وقع..."></textarea>

  <button id="go">ابدأ التشخيص</button>

  <div id="result"></div>
  <div id="sources"></div>
</div>

<script src="phones.js"></script>
<script>
  const brandEl = document.getElementById('brand');
  const modelEl = document.getElementById('model');
  const faultEl = document.getElementById('fault');
  const resultEl = document.getElementById('result');
  const sourcesEl = document.getElementById('sources');
  const goBtn = document.getElementById('go');

  Object.keys(PHONES).forEach(b => brandEl.add(new Option(b, b)));
  FAULTS.forEach(f => faultEl.add(new Option(f, f)));

  function loadModels() {
    modelEl.innerHTML = '';
    PHONES[brandEl.value].forEach(m => modelEl.add(new Option(m, m)));
  }
  brandEl.addEventListener('change', loadModels);
  loadModels();

  goBtn.addEventListener('click', async () => {
    const payload = {
      brand: brandEl.value,
      model: modelEl.value,
      os: document.getElementById('os').value,
      fault: faultEl.value,
      desc: document.getElementById('desc').value
    };
    goBtn.disabled = true;
    goBtn.textContent = 'جاري البحث والتشخيص...';
    resultEl.style.display = 'none';
    sourcesEl.innerHTML = '';
    try {
      const res = await fetch('/.netlify/functions/diagnose', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      const data = await res.json();
      resultEl.textContent = data.answer || data.error || 'حصل خطأ';
      resultEl.style.display = 'block';
      (data.sources || []).forEach(s => {
        const a = document.createElement('a');
        a.href = s.url; a.target = '_blank'; a.textContent = s.title || s.url;
        sourcesEl.appendChild(a);
      });
    } catch (e) {
      resultEl.textContent = 'حصل خطأ في الاتصال، حاول تاني.';
      resultEl.style.display = 'block';
    }
    goBtn.disabled = false;
    goBtn.textContent = 'ابدأ التشخيص';
  });
</script>
</body>
</html>
